name: Atualizar dados e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # 4x por dia; com o crawl-delay de 6 min da Liga, ~55 edicoes por execucao
  workflow_dispatch:
    inputs:
      max:
        description: "Maximo de edicoes para baixar"
        default: "55"
      only:
        description: "Siglas especificas (separadas por espaco), opcional"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  data:
    # push so publica; agendamento e execucao manual atualizam os dados da Liga
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # uma execucao de scraping por vez, para respeitar o crawl-delay
    concurrency:
      group: liga-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar edicoes da Liga
        run: |
          ARGS="--max ${{ github.event.inputs.max || '55' }} --minutes 330"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python scripts/build_data.py $ARGS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "dados: atualiza edicoes da Liga"
          git pull --rebase
          git push

  deploy:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pega o commit de dados recem-criado
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
