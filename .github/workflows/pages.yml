name: Atualizar dados e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # todo dia ~03:17 (horario de Brasilia)
  workflow_dispatch:
    inputs:
      max:
        description: "Maximo de edicoes para baixar"
        default: "12"
      only:
        description: "Siglas especificas (separadas por espaco), opcional"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    # push so publica; agendamento e execucao manual atualizam os dados da Liga
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar edicoes da Liga
        run: |
          ARGS="--max ${{ github.event.inputs.max || '12' }}"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python scripts/build_data.py $ARGS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "dados: atualiza edicoes da Liga" && git push

  deploy:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pega o commit de dados recem-criado
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
