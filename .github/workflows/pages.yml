name: Atualizar dados e publicar

# Os dados da Liga sao atualizados fora daqui: a LigaMagic (Cloudflare) responde 403 para os
# runners do GitHub, entao scripts/atualizar_liga.ps1 roda num PC comum e faz push de docs/data.
# O push publica o site. A execucao manual (workflow_dispatch) ainda tenta o scraping no runner.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max:
        description: "Maximo de edicoes para baixar"
        default: "55"
      only:
        description: "Siglas especificas (separadas por espaco), opcional"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  data:
    # push so publica; a execucao manual tenta atualizar os dados da Liga (hoje a Liga barra o runner com 403)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # uma execucao de scraping por vez, para respeitar o crawl-delay
    concurrency:
      group: liga-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar edicoes da Liga
        run: |
          ARGS="--max ${{ github.event.inputs.max || '55' }} --minutes 330"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python scripts/build_data.py $ARGS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "dados: atualiza edicoes da Liga"
          git pull --rebase
          git push

  deploy:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pega o commit de dados recem-criado
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
